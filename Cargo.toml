[package]
name = "weave"
version = "0.1.0"
edition = "2021"
description = "Rust-native agent-to-agent session mesh with a native injector (tmux + zellij)"
license = "MIT OR Apache-2.0"
repository = "local"

[[bin]]
name = "weave"
path = "src/main.rs"

# Criterion-driven benchmark harness lives in benches/weave_bench.rs.
# `harness = false` disables the libtest harness so criterion's own
# `main!` entrypoint is used instead.
[[bench]]
name = "weave_bench"
harness = false

# Dependencies are added via `cargo add` so versions resolve to current.

[features]
# Backends are MUTUALLY EXCLUSIVE: rusqlite (bundled) and libsql each statically
# link their own SQLite C core, so enabling both produces duplicate-symbol link
# errors. Pick one:
#   default build           -> sqlite  (rusqlite, bundled)
#   --no-default-features --features libsql  -> libSQL/Turso (cross-machine sync)
# A compile_error! in main.rs guards against enabling both at once.
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
# The async libsql client is driven from sync code via an embedded current-thread
# tokio runtime, so the `libsql` feature pulls in both the libsql client and tokio.
libsql = ["dep:libsql", "dep:tokio"]
# OPTIONAL signed sender identity (Tier-2 phase 2d). Mirrors the `libsql` optional
# pattern: the crypto crate is `optional`, so the DEFAULT build pulls in NOTHING
# extra — `cargo tree` on the default build never shows `ed25519-dalek`. Only a
# `--features sign` build links the signer/verifier. Composes with BOTH backends
# (`sqlite sign` and `libsql sign`). `getrandom` is pulled only here, to seed key
# GENERATION (verification needs no RNG); it is a tiny, std-backed crate already in
# the dependency universe, so it adds no heavyweight tree.
sign = ["dep:ed25519-dalek", "dep:getrandom", "dep:sha2"]

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
# Shell-completion and man-page generators for clap. Build-time only in spirit
# (invoked from the CLI to emit completion scripts / a man page), but they read
# clap's `Command`, so they live as regular deps alongside clap.
clap_complete = "4.6.1"
clap_mangen = "0.2.31"
# Signed sender identity (Tier-2 phase 2d) — OPTIONAL, gated behind the `sign`
# feature so the default static binary gains nothing. Ed25519 is the standard for
# compact, deterministic signatures over a short canonical message; dalek v2 is the
# most widely-audited pure-Rust impl and decouples the RNG so VERIFICATION needs no
# RNG at all. Key GENERATION fills 32 secret bytes from the OS CSPRNG via
# `getrandom` (a tiny, std-backed crate) and constructs the key with
# `SigningKey::from_bytes`, so we avoid coupling to dalek's `rand_core` version.
ed25519-dalek = { version = "2", optional = true }
getrandom = { version = "0.2", optional = true }
libsql = { version = "0.9.30", optional = true }
rusqlite = { version = "0.40.0", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
# SHA-256 for the public-key FINGERPRINT (`SHA256:` + hex of SHA256(raw 32-byte
# pubkey)). OPTIONAL and pulled ONLY by the `sign` feature — and already a
# transitive dep of `ed25519-dalek` in that tree, so declaring it adds NO new
# compiled crate to any graph (`cargo tree` is byte-identical; only an existing
# transitive edge becomes a declared direct one). The default + libsql-no-sign
# builds never compile it. Fingerprints are derived from the PUBLIC key only.
sha2 = { version = "0.10", optional = true }
# `preserve_order` keeps the user's settings.json key order intact on rewrite, so
# `weave setup`/`uninstall` only diff weave's own additions/removals.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
# `rt` drives the embedded current-thread runtime; `time` is required for
# `tokio::time::timeout`, which bounds every REMOTE libsql network call (connect +
# SELECT) so an unreachable Turso source cannot hang a drain (libsql 0.9.30 has no
# client-side connect/request timeout knob). Both ride the optional `libsql`
# feature; the default sqlite build pulls in neither.
tokio = { version = "1.52.3", features = ["rt", "time"], optional = true }
toml = "1.1.2"

[dev-dependencies]
# Property-based testing for the storage/inject invariants.
proptest = "1.8.0"
# Benchmarking harness; see the [[bench]] entry above. `html_reports` keeps the
# default feature set explicit.
criterion = { version = "0.7.0", features = ["html_reports"] }
[workspace]
