[package]
name = "weave"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native agent-to-agent session mesh with a native injector"

[[bin]]
name = "weave"
path = "src/main.rs"

[[bench]]
name = "weave_bench"
harness = false

[features]
default = ["sqlite"]
sqlite = ["weave-core/sqlite"]
libsql = ["weave-core/libsql", "weave-mcp/libsql"]
sign = ["weave-core/sign", "weave-mcp/sign"]
llm = ["weave-core/llm"]
# WL-048 / ADR-0004: human surfaces. The dashboard render lives in weave-mcp; the
# bot bridges live in this bin — so the flag threads to BOTH core and mcp, and
# pulls reqwest into THIS crate (the bots' HTTP client). Cargo unifies it with the
# `weave-core/surfaces`+`llm` reqwest ⇒ still ONE reqwest copy in the binary.
surfaces = ["weave-core/surfaces", "weave-mcp/surfaces", "dep:reqwest"]

[dependencies]
weave-core = { path = "../weave-core", default-features = false }
weave-inject = { path = "../weave-inject" }
weave-mcp = { path = "../weave-mcp", default-features = false }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
clap_mangen = "0.2.31"
# WL-048 bot HTTP client — same blocking+rustls reqwest weave-core uses under
# `llm`; optional + gated under `surfaces` so the default build links none.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
# FrankenNetworkX graph primitives — extracted for peer/message network analysis.
# These are workspace-internal crates; we reference them by git + path.
fnx-classes = { git = "https://github.com/Dicklesworthstone/franken_networkx" }
fnx-algorithms = { git = "https://github.com/Dicklesworthstone/franken_networkx" }
fnx-runtime = { git = "https://github.com/Dicklesworthstone/franken_networkx" }

[dev-dependencies]
proptest = "1.8.0"
criterion = { version = "0.7.0", features = ["html_reports"] }
