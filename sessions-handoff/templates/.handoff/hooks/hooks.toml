schema = "handoff.hooks.v1"

[[hooks]]
event = "SessionStart"
command = "hf resume --compact"
timeout_seconds = 10
fail_mode = "warn"

[[hooks]]
event = "TaskClaim"
command = "hf policy check-claim --json"
timeout_seconds = 15
fail_mode = "block"

[[hooks]]
event = "PreEdit"
command = "hf policy check-edit --json"
timeout_seconds = 5
fail_mode = "block"

[[hooks]]
event = "PostEdit"
command = "hf checkpoint --auto --changed-files"
timeout_seconds = 30
fail_mode = "warn"

[[hooks]]
event = "PreHandoff"
command = "hf drift --json && hf policy check-handoff --json"
timeout_seconds = 30
fail_mode = "block"

[[hooks]]
event = "SessionStop"
command = "hf checkpoint --auto && hf handoff --auto"
timeout_seconds = 60
fail_mode = "warn"
