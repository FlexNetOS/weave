# weave-loop lifecycle hooks
#
# These are NOT executable hooks — they are documentation of the hook events
# that the weave binary handles via `weave hook <session|prompt|stop|wake|notification>`.
#
# The actual hook wiring is in Claude Code settings.json (managed by `weave setup`).

[[hooks]]
event = "SessionStart"
command = "weave hook session"
description = "Auto-register peer, drain inbox, set turn_state to pending_first_turn"

[[hooks]]
event = "UserPromptSubmit"
command = "weave hook prompt"
description = "Drain inbox (mark read), set turn_state to working, check for unacked asks"

[[hooks]]
event = "Stop"
command = "weave hook stop"
description = "Peek inbox (mark_read=false), set turn_state to idle"

[[hooks]]
event = "SubagentStop"
command = "weave hook stop"
description = "Same as Stop — peek only"

[[hooks]]
event = "Notification"
command = "weave hook notification"
description = "Drain inbox, set turn_state to awaiting_input"

[[hooks]]
event = "Wake"
command = "weave hook wake"
description = "Blocking drain — used after stop-boundary wake (future: WL-025)"
