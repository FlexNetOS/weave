[package]
name = "weave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, storage backends, and configuration for weave"

[features]
sqlite = ["dep:rusqlite"]
libsql = ["dep:libsql", "dep:tokio"]
sign = ["dep:ed25519-dalek", "dep:sha2"]
llm = ["dep:reqwest"]
# WL-048 / ADR-0004: human surfaces (dashboard + Telegram/Slack bridges). Shares
# the optional `reqwest` blocking client with `llm` (Cargo unions the feature ⇒
# one reqwest copy). Default OFF ⇒ the default build gains zero compiled deps.
surfaces = ["dep:reqwest"]
# WL-049 / ADR-0002: obscura governed web access. weave-core holds only the pure
# web-access policy + SSRF/loopback URL validator (no I/O); the optional `url`
# parser keeps its authority semantics aligned with a browser. Default OFF ⇒ the
# default build gains zero compiled deps. The MCP client that spawns the `obscura`
# binary lives in weave-mcp.
obscura = ["dep:url"]

[dependencies]
anyhow = "1.0.102"
ed25519-dalek = { version = "2", optional = true }
getrandom = "0.2"
# WL-044b: trim to the features weave actually uses — `core` (local file via
# `Builder::new_local`) + `remote`+`tls` (remote Turso over HTTPS via
# `Builder::new_remote`). weave uses NO embedded-replica sync, so dropping the
# default `replication`/`sync` features removes their dependency trees — most
# notably the unmaintained `bincode 1.x` (RUSTSEC-2025-0141, pulled only by
# `replication`) plus tonic/tower-http/etc. — with zero capability loss. The
# remaining rustls-webpki/rustls-pemfile advisories live in `tls` (hyper-rustls),
# which weave needs for remote HTTPS and which libsql still pins to 0.25 (even on
# git main) — tracked in deny.toml + WL-044b.
libsql = { version = "0.9.30", default-features = false, features = ["core", "remote", "tls"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1.52.3", features = ["rt", "time"], optional = true }
toml = "1.1.2"
url = { version = "2.5", optional = true }

[dependencies.rusqlite]
version = "0.40.0"
features = ["bundled"]
optional = true

[dev-dependencies]
proptest = "1.8.0"
