[package]
name = "weave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, storage backends, and configuration for weave"

[features]
sqlite = ["dep:rusqlite"]
libsql = ["dep:libsql", "dep:tokio"]
sign = ["dep:ed25519-dalek", "dep:sha2"]

[dependencies]
anyhow = "1.0.102"
ed25519-dalek = { version = "2", optional = true }
getrandom = "0.2"
libsql = { version = "0.9.30", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1.52.3", features = ["rt", "time"], optional = true }
toml = "1.1.2"

[dependencies.rusqlite]
version = "0.40.0"
features = ["bundled"]
optional = true

[dev-dependencies]
proptest = "1.8.0"
