[package]
name = "weave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, storage backends, and configuration for weave"

[features]
sqlite = ["dep:rusqlite"]
libsql = ["dep:libsql", "dep:tokio"]
sign = ["dep:ed25519-dalek", "dep:sha2"]
llm = ["dep:reqwest"]
# WL-048 / ADR-0004: human surfaces (dashboard + Telegram/Slack bridges). Shares
# the optional `reqwest` blocking client with `llm` (Cargo unions the feature ⇒
# one reqwest copy). Default OFF ⇒ the default build gains zero compiled deps.
surfaces = ["dep:reqwest"]
# WL-049 / ADR-0002: obscura governed web access. weave-core holds only the pure
# web-access policy + SSRF/loopback URL validator (no I/O, no new dep — std + the
# already-present serde_json suffice). Default OFF ⇒ the default build gains zero
# compiled deps. The MCP client that spawns the `obscura` binary lives in weave-mcp.
obscura = []

[dependencies]
anyhow = "1.0.102"
ed25519-dalek = { version = "2", optional = true }
getrandom = "0.2"
libsql = { version = "0.9.30", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1.52.3", features = ["rt", "time"], optional = true }
toml = "1.1.2"

[dependencies.rusqlite]
version = "0.40.0"
features = ["bundled"]
optional = true

[dev-dependencies]
proptest = "1.8.0"
