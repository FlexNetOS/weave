name: CI

on:
  # Push only on the trunks (sync-master needs their checks); feature branches are
  # covered by the pull_request trigger, so a PR branch no longer runs CI twice.
  push:
    branches: ["master", "develop"]
  pull_request:

# Cancel a superseded run for the same ref instead of racing it. A fresh push to a
# PR (or trunk) supersedes the in-flight run, so two runs can't fight over the same
# required checks (the duplicate-run flake that forced reruns on WL-050..053).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --all-targets
        run: cargo test --all-targets

  target-smoke:
    # WL-081: generated-artifact smoke. This executes the compiled binaries
    # directly from target/debug and target/release and writes a machine-readable
    # target/target-smoke/target-smoke.json report. The full feature matrix is
    # available locally with `python3 scripts/target_smoke.py --full`; CI keeps
    # the always-on root debug/release artifact proof.
    name: target artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: smoke generated target artifacts
        run: python3 scripts/target_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-smoke-report
          path: target/target-smoke/target-smoke.json
          if-no-files-found: ignore

  libsql:
    # The libSQL backend is a SEPARATE binary build: rusqlite and libsql each
    # bundle their own SQLite, so they are mutually-exclusive features. Build it
    # alone with --no-default-features --features libsql (enabling both triggers a
    # compile_error!). This is a real, blocking gate.
    name: build (libsql backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (libsql)
        run: cargo clippy --no-default-features --features libsql --all-targets -- -D warnings
      - name: build (libsql)
        run: cargo build --no-default-features --features libsql
      - name: test (libsql)
        run: cargo test --no-default-features --features libsql

  sign:
    # The optional signed-identity path (ed25519, gated behind `sign`) is compiled
    # out of the default binary, so it needs its own column or a regression there
    # ships unnoticed. This is the sqlite backend WITH `sign`.
    name: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (sign)
        run: cargo clippy --all-targets --features sign -- -D warnings
      - name: test (sign)
        run: cargo test --features sign

  libsql-sign:
    # The libSQL × sign cross-product: the crypto path on the cross-machine backend.
    # Mutually-exclusive backends mean this is a separate binary from the `sign` job.
    name: libsql + sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (libsql + sign)
        run: cargo clippy --no-default-features --features "libsql sign" --all-targets -- -D warnings
      - name: build (libsql + sign)
        run: cargo build --no-default-features --features "libsql sign"
      - name: test (libsql + sign)
        run: cargo test --no-default-features --features "libsql sign"

  surfaces:
    # The optional human surfaces (dashboard + Telegram/Slack, gated behind
    # `surfaces`, WL-048) are compiled out of the default binary, so they need their
    # own column or an XSS/render regression ships unnoticed. This is the sqlite
    # backend WITH `surfaces`.
    name: surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (surfaces)
        run: cargo clippy --all-targets --features surfaces -- -D warnings
      - name: test (surfaces)
        run: cargo test --features surfaces

  libsql-surfaces:
    # The libSQL × surfaces cross-product: the human surfaces on the cross-machine
    # backend. No Store change, but the feature must compile + serve on both backends.
    name: libsql + surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (libsql + surfaces)
        run: cargo clippy --no-default-features --features "libsql surfaces" --all-targets -- -D warnings
      - name: build (libsql + surfaces)
        run: cargo build --no-default-features --features "libsql surfaces"
      - name: test (libsql + surfaces)
        run: cargo test --no-default-features --features "libsql surfaces"

  audit:
    # WL-044: supply-chain advisory gate (this job did not exist before WL-044).
    # cargo-deny scans the dependency graph against the RustSec advisory DB.
    # deny.toml sets `[graph] all-features = true` — REQUIRED so the scan sees the
    # libsql remote-TLS crates (absent from the default sqlite graph); without it
    # the gate would never see the very advisories it governs. weave's default
    # build is advisory-clean; the ONLY exceptions are the upstream-pinned libsql
    # remote-TLS advisories documented (rationale + removal trigger) in deny.toml,
    # tracked by WL-044b. Any advisory NOT in that explicit list fails this job —
    # proven by the negative test (dropping an id → `error[vulnerability]`, exit 1).
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: supply-chain posture preflight
        run: python3 scripts/supply_chain_audit.py --allow-missing-cargo-deny
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
